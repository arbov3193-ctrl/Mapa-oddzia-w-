<style>
:root{--bg:#ffffff;--ink:#1f2328;--muted:#656d76;--line:#d8dee4;--acc:#ffcd00;--accink:#1f2328;--hover:#f3f4f6}
@media (prefers-color-scheme:dark){:root{--bg:#1c1f24;--ink:#e6edf3;--muted:#9198a1;--line:#30363d;--hover:#262b31}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);display:flex}
aside{width:200px;flex:none;border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;background:var(--bg);display:flex;flex-direction:column;gap:4px}
aside h1{font-size:15px;font-weight:600;margin:0 8px 12px}
aside button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:15px}
aside button:hover{background:var(--hover)}
aside button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
aside button.on{background:var(--acc);color:var(--accink);font-weight:600}
aside .count{margin:auto 8px 0;font-size:13px;color:var(--muted)}
#map{flex:1;height:100%}
.pin{width:38px;height:38px;border-radius:50%;border:2.5px solid #fff;color:#fff;font:700 11.5px/33px system-ui,Arial,sans-serif;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.pin.ap{border-style:dashed}
.pin.wide{width:54px;height:54px;font-size:10.5px;line-height:49px;letter-spacing:-.2px}
.leaflet-popup-content{font-size:13px;line-height:1.5}.leaflet-popup-content b{font-size:14px}
.leaflet-popup-content i{color:#a15c00}
@media (max-width:640px){body{flex-direction:column}
aside{width:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) 8px 8px}
aside h1{margin:0 8px 0 4px}aside .count{margin:0 4px 0 auto}}

const map=L.map('map');
const TILES=[
 ['https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}],
 ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'&copy; Esri, OpenStreetMap'}]
];
let ti=0,errs=0,base;
function setBase(){if(base)map.removeLayer(base);errs=0;base=L.tileLayer(...TILES[ti]).addTo(map);
 base.on('tileerror',()=>{if(++errs>4&&ti<TILES.length-1){ti++;setBase();}});}
setBase();
function build(list){
  const g=L.layerGroup(),grp={};
  list.forEach(p=>{const key=p.lat.toFixed(4)+','+p.lng.toFixed(4);(grp[key]=grp[key]||[]).push(p);});
  Object.values(grp).forEach(ps=>{
    const p=ps[0],code=ps.map(q=>q.k).join('/'),wide=ps.length>1,sz=wide?54:38;
    const icon=L.divIcon({className:'',html:`<div class="pin${p.ap?' ap':''}${wide?' wide':''}" style="background:${p.c}">${code}</div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2],popupAnchor:[0,-sz/2]});
    const txt=ps.map(q=>`<b>${q.k}</b> ${q.n}`).join('<br>')+'<br>'+p.a+(p.ap?'<br><i>Lokalizacja przybliżona</i>':'');
    L.marker([p.lat,p.lng],{icon,title:code}).bindPopup(txt).addTo(g);
  });
  return {g,b:L.latLngBounds(list.map(p=>[p.lat,p.lng])).pad(0.06),n:list.length};
}
const V={full:build(D.full),pzs:build(D.pzs)};
let cur=null;
function show(id){
  if(cur)map.removeLayer(V[cur].g);cur=id;V[id].g.addTo(map);map.invalidateSize();map.fitBounds(V[id].b);
  document.querySelectorAll('aside button').forEach(b=>b.classList.toggle('on',b.id===id));
  document.querySelector('.count').textContent=V[id].n+' punktów';
}
document.getElementById('full').onclick=()=>{location.hash='';show('full')};
document.getElementById('pzs').onclick=()=>{location.hash='pzs';show('pzs')};
show(location.hash==='#pzs'?'pzs':'full');
window.addEventListener('load',()=>{map.invalidateSize();map.fitBounds(V[cur].b);});
